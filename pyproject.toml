[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrastar_pitch"
dynamic = ["version"]
description = "Automate the pitch detection process for Ultrastar Deluxe karaoke projects"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "paradigm", email = "ultrastarpitch@gmail.com"},
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "onnxruntime-gpu",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/paradigmn/ultrastar_pitch"

[project.scripts]
ultrastar-pitch = "ultrastar_pitch.ultrastar_pitch:main"

[dependency-groups]
dev = [
    "onnx>=1.14.1",
    "pyinstaller",
]

[tool.setuptools.dynamic]
version = {attr = "ultrastar_pitch.version.__version__"}

[tool.setuptools]
include-package-data = true
zip-safe = false
packages = ["ultrastar_pitch", "ultrastar_pitch.binaries"]

[tool.setuptools.package-data]
ultrastar_pitch = [
    "binaries/*.ico",
    "binaries/*.png",
    "binaries/*.onnx",
    "binaries/README.md",
]
